<!-- Wishlist Modal -->
<div class="modal fade" id="wishlistModal" tabindex="-1" aria-labelledby="wishlistModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="wishlistModalLabel">Add to Wishlist</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p>Would you like to add this product to your wishlist?</p>
          <form action="{{ url_for('wishlist.add_to_wishlist') }}" method="POST">
            <input type="hidden" name="product_id" id="wishlist-product-id" value="">
            <button type="submit" class="btn btn-primary">Add to Wishlist</button>
          </form>
        </div>
      </div>
    </div>
  </div>
